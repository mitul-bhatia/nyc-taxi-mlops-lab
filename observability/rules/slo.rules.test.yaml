# promtool unit tests for slo.rules.yaml (S5): an outage pages, a short spike doesn't.
# One sample per minute; requests are 200 per minute.
rule_files:
  - slo.rules.yaml
evaluation_interval: 1m

tests:
  # 1. Serving dies at minute 30 and stays down: the app keeps answering 200, but with the median.
  #    The model SLO pages; availability, which only sees 5xx, does not.
  - interval: 1m
    input_series:
      - series: 'lab_predictions_total{source="model",alias="champion",version="2"}'
        values: "0+200x30 6000x90"
      - series: 'lab_predictions_total{source="fallback",alias="",version=""}'
        values: "0x30 0+200x90"
      - series: 'lab_http_requests_total{route="/predict",method="POST",code="200"}'
        values: "0+200x120"
    alert_rule_test:
      - eval_time: 55m
        alertname: PredictModelFastBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: predict-model}
            exp_annotations:
              summary: "Riders are getting the static median instead of the model: serving is down, slow, or has no champion."
      - eval_time: 55m
        alertname: PredictAvailabilityFastBurn
        exp_alerts: []

  # 2. Half of /predict answers are 500 for an hour: availability pages.
  - interval: 1m
    input_series:
      - series: 'lab_http_requests_total{route="/predict",method="POST",code="200"}'
        values: "0+100x120"
      - series: 'lab_http_requests_total{route="/predict",method="POST",code="500"}'
        values: "0+100x120"
    alert_rule_test:
      - eval_time: 45m
        alertname: PredictAvailabilityFastBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: predict-availability}
            exp_annotations:
              summary: "Riders are getting /predict errors fast enough to use the month's error budget in about 2 days."

  # 3. One minute of 500s in two hours of healthy traffic: a short spike must not page.
  - interval: 1m
    input_series:
      - series: 'lab_http_requests_total{route="/predict",method="POST",code="200"}'
        values: "0+200x120"
      - series: 'lab_http_requests_total{route="/predict",method="POST",code="500"}'
        values: "0x50 200x70"
    alert_rule_test:
      - eval_time: 55m
        alertname: PredictAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 90m
        alertname: PredictAvailabilitySlowBurn
        exp_alerts: []

  # 4. Every answer slower than 250 ms for an hour: latency pages.
  - interval: 1m
    input_series:
      - series: 'lab_http_request_duration_seconds_bucket{route="/predict",method="POST",le="0.25"}'
        values: "0+200x30 6000x90"
      - series: 'lab_http_request_duration_seconds_count{route="/predict",method="POST"}'
        values: "0+200x120"
    alert_rule_test:
      - eval_time: 55m
        alertname: PredictLatencyFastBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: predict-latency}
            exp_annotations:
              summary: "Most /predict answers are slower than 250 ms."

  # 5. Only healthy traffic, so no 5xx series and no fallback series exist: the ratios must read 0
  #    (all good), not "no data".
  - interval: 1m
    input_series:
      - series: 'lab_http_requests_total{route="/predict",method="POST",code="200"}'
        values: "0+200x60"
      - series: 'lab_predictions_total{source="model",alias="champion",version="2"}'
        values: "0+200x60"
    promql_expr_test:
      - expr: lab:predict_error_ratio:rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'lab:predict_error_ratio:rate5m'
            value: 0
      - expr: lab:predict_fallback_ratio:rate30m
        eval_time: 40m
        exp_samples:
          - labels: 'lab:predict_fallback_ratio:rate30m'
            value: 0
